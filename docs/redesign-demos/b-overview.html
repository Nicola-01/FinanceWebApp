<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction B — Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141312; --surface: #1d1c1a; --raised: #252321; --line: #2e2c29;
    --text: #efece6; --muted: #9a958c; --faint: #6b665e;
    --income: #7fbf8e; --expense: #e07a6a; --warn: #e3b25a;
    --wallet: #e6c229;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 "Instrument Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  aside { background: var(--surface); padding: 20px 14px; display: flex; flex-direction: column; gap: 2px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; padding: 0 8px 24px; }
  .brand img { width: 24px; }
  .w { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; text-align: left; color: var(--muted); }
  .w:hover { color: var(--text); }
  .w[aria-current] { background: var(--raised); color: var(--text); }
  .w .sw { width: 10px; height: 10px; border-radius: 50%; }
  .w .n { margin-left: auto; font-size: 13px; color: var(--faint); }
  .side-foot { margin-top: auto; display: grid; gap: 2px; }

  main { padding: 28px 40px 60px; max-width: 1180px; width: 100%; min-width: 0; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
  .seg { display: inline-flex; background: var(--surface); border-radius: 10px; padding: 3px; overflow-x: auto; max-width: 100%; }
  .seg button { padding: 6px 14px; border-radius: 8px; color: var(--muted); white-space: nowrap; }
  .seg button[aria-selected="true"] { background: var(--raised); color: var(--text); box-shadow: 0 1px 0 rgba(255,255,255,.04) inset; }
  .me { display: flex; gap: 14px; align-items: center; color: var(--muted); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: #3b3833; display: grid; place-items: center; color: var(--text); font-size: 13px; }

  .hero { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; }
  .hero > div { background: var(--surface); padding: 20px 22px; }
  .hero .name { display: flex; flex-direction: column; justify-content: space-between; }
  .hero h1 { font-size: 26px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .hero h1 .sw { width: 12px; height: 12px; border-radius: 50%; background: var(--wallet); }
  .month { display: flex; align-items: center; gap: 6px; color: var(--muted); margin-top: 14px; }
  .month button { width: 26px; height: 26px; border-radius: 6px; background: var(--raised); }
  .month span { color: var(--text); padding: 0 6px; }
  .k { color: var(--muted); font-size: 13px; }
  .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin-top: 6px; }
  .v.in { color: var(--income); }
  .sub { color: var(--faint); font-size: 13px; margin-top: 2px; }
  .meter { height: 6px; background: var(--raised); border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--expense); }

  .cols { display: grid; grid-template-columns: 1fr 300px; gap: 32px; margin-top: 32px; }
  h2 { font-size: 17px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  h2 small { color: var(--muted); font-weight: 400; font-size: 14px; }
  .btn { padding: 8px 14px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 600; }
  .tools { display: flex; gap: 10px; margin-bottom: 8px; }
  .tools input { flex: 1; background: var(--surface); border: 1px solid transparent; border-radius: 10px; padding: 8px 12px; color: var(--text); font: inherit; }
  .tools input:focus { outline: none; border-color: var(--faint); }
  .ghost { padding: 8px 14px; border-radius: 10px; background: var(--surface); color: var(--muted); }

  .group { margin-top: 18px; }
  .group .d { color: var(--muted); font-size: 13px; padding: 0 4px 6px; }
  .item { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 9px 4px; border-radius: 8px; }
  .item:hover { background: var(--surface); }
  .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; }
  .t { font-weight: 500; }
  .c { color: var(--muted); font-size: 13px; }
  .a { font-weight: 500; }
  .a.in { color: var(--income); }

  .todo { background: var(--surface); border-radius: 12px; padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-bottom: 8px; }
  .todo .c { color: var(--warn); }
  .todo input { width: 100px; background: var(--raised); border: 0; border-radius: 8px; padding: 7px 10px; color: var(--text); font: inherit; text-align: right; }

  .up { background: var(--surface); border-radius: 14px; padding: 6px 14px; }
  .up .item { padding: 10px 0; border-bottom: 1px solid var(--line); border-radius: 0; }
  .up .item:last-child { border: 0; }
  .up .item:hover { background: none; }
  .due { font-size: 13px; color: var(--muted); text-align: right; }
  .due.soon { color: var(--warn); }

  @media (max-width: 1000px) {
    .cols { grid-template-columns: 1fr; }
    .hero { grid-template-columns: 1fr 1fr; }
    .hero .name { grid-column: 1 / -1; }
  }
  @media (max-width: 700px) {
    .app { grid-template-columns: 1fr; }
    aside { display: none; }
    main { padding: 16px 16px 48px; }
    .me { display: none; }
    .hero { grid-template-columns: 1fr 1fr 1fr; }
    .hero > div { padding: 14px; }
    .v { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><img src="icon.svg" alt="">My Wallet</div>
    <button class="w"><span class="sw" style="background:#8b5cf6"></span>Empty</button>
    <button class="w" aria-current="page"><span class="sw" style="background:var(--wallet)"></span>Demo Wallet</button>
    <div class="side-foot">
      <button class="w">Invitations<span class="n">0</span></button>
      <button class="w">+ New wallet</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="seg" role="tablist">
        <button role="tab" aria-selected="true">Transactions</button>
        <button role="tab">Subscriptions</button>
        <button role="tab">Categories</button>
        <button role="tab">Statistics</button>
        <button role="tab">Budget</button>
        <button role="tab">Settings</button>
      </div>
      <div class="me"><span aria-label="Notifications">🔔</span><span class="avatar">A</span></div>
    </div>

    <section class="hero">
      <div class="name">
        <h1><span class="sw"></span>Demo Wallet</h1>
        <div class="month"><button aria-label="Previous month">‹</button><span>October 2026</span><button aria-label="Next month">›</button></div>
      </div>
      <div><div class="k">Income</div><div class="v in">+1,750.01 €</div><div class="sub">1 transaction</div></div>
      <div><div class="k">Spent</div><div class="v">10,766.74 €</div><div class="sub">615% of income</div><div class="meter"><i style="width:100%"></i></div></div>
      <div><div class="k">Net</div><div class="v">−9,016.73 €</div><div class="sub">Avg +156.33 € / month</div></div>
    </section>

    <div class="cols">
      <section>
        <h2>Transactions <small>20 this month</small></h2>
        <div class="tools"><input placeholder="Search transactions" aria-label="Search transactions"><button class="ghost">Filters</button><button class="btn">New transaction</button></div>
        <div class="todo">
          <div><div class="t">Car Tax</div><div class="c">Due 30 Oct, waiting for the amount</div></div>
          <div style="display:flex;gap:8px"><input placeholder="0.00 €" aria-label="Amount for Car Tax"><button class="ghost">Save</button></div>
        </div>
        <div id="list"></div>
      </section>

      <section>
        <h2>Coming up <small>next 31 days</small></h2>
        <div class="up" id="up"></div>
      </section>
    </div>
  </main>
</div>

<script>
  const fmt = n => (n > 0 ? "+" : "−") + Math.abs(n).toLocaleString("en", { minimumFractionDigits: 2 }) + " €";
  const tint = c => `background:${c}22;color:${c}`;
  const days = [
    ["Thu 29 Oct", [["🍴", "Food & Entertainment", "Dinner out", "#e0457b", -123], ["🍎", "Groceries", "Food", "#e8a33d", -123], ["🍎", "Groceries", "Food", "#e8a33d", -888], ["🍎", "Groceries", "Food", "#e8a33d", -8347]]],
    ["Tue 27 Oct", [["💵", "Monthly Salary", "Work › Salary", "#7fbf8e", 1750.01], ["🚗", "Car", "Car", "#e07a6a", -5], ["🍦", "Ice Cream", "Food & Entertainment", "#4fa3d9", -4], ["🎬", "Netflix", "Subscriptions", "#c0392b", -2], ["🎵", "Spotify", "Subscriptions", "#3dbb6b", -2]]],
    ["Tue 20 Oct", [["🎵", "Spotify Premium", "Subscriptions › Spotify", "#3dbb6b", -10.99]]],
  ];
  document.getElementById("list").innerHTML = days.map(([d, rows]) => `
    <div class="group"><div class="d">${d}</div>${rows.map(([i, t, c, col, a]) => `
      <div class="item"><span class="ic" style="${tint(col)}">${i}</span><div><div class="t">${t}</div><div class="c">${c}</div></div><div class="a ${a > 0 ? "in" : ""}">${fmt(a)}</div></div>`).join("")}</div>`).join("");
  const up = [["🎬", "Netflix Standard", "#c0392b", -12.99, "in 3 days", 1], ["🎵", "Spotify Premium", "#3dbb6b", -10.99, "in 8 days"], ["💵", "Monthly Salary", "#7fbf8e", 1750, "in 15 days"], ["🛒", "Prime Renewal", "#4fa3d9", -49.9, "in 1 month"]];
  document.getElementById("up").innerHTML = up.map(([i, t, col, a, due, soon]) => `
    <div class="item"><span class="ic" style="${tint(col)}">${i}</span><div><div class="t">${t}</div><div class="c">${fmt(a)}</div></div><div class="due ${soon ? "soon" : ""}">${due}</div></div>`).join("");
</script>
</body>
</html>
