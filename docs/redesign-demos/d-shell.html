<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction D — Dashboard shell</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  /* Phase 2 open choices: desktop header (H1/H2) and phone layout (M1/M2/M3). ?light for light theme. */
  :root { --bg: #141312; --surface: #1d1c1a; --raised: #262421; --line: #2e2c29; --text: #efece6; --muted: #9a958c; --faint: #6b665e; --income: #7fcf95; --ring: none; --wallet: #f2cc2f; --on-wallet: #1d1a10; }
  :root.light { --bg: #f4f3f1; --surface: #fff; --raised: #eeece8; --line: #e4e1dc; --text: #1c1a17; --muted: #6b665e; --faint: #9a958c; --income: #2f8f55; --ring: 0 0 0 1px #e4e1dc; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #0b0b0a; color: #efece6; font: 15px/1.5 "Instrument Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; padding: 24px; }
  :root.light body { background: #d9d6d0; color: #1c1a17; }
  .h { font: 700 22px "Bricolage Grotesque"; margin: 8px 0 4px; }
  .lead { opacity: .7; margin-bottom: 16px; max-width: 900px; }
  .frame { background: var(--bg); color: var(--text); border-radius: 14px; overflow: hidden; margin-bottom: 36px; }
  .disp { font-family: "Bricolage Grotesque"; letter-spacing: -.02em; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* desktop */
  .app { display: grid; grid-template-columns: 228px 1fr; min-height: 560px; }
  aside { background: var(--surface); box-shadow: var(--ring); padding: 18px 14px; display: flex; flex-direction: column; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 8px; font: 700 18px "Bricolage Grotesque"; padding: 0 6px 14px; }
  .brand img { width: 28px; }
  .side-h { color: var(--muted); font-size: 13px; padding: 0 6px; }
  .mini { display: grid; grid-template-columns: 1fr auto; align-items: end; height: 58px; padding: 10px 12px; border-radius: 12px; background: var(--raised); color: var(--text); box-shadow: inset 4px 0 0 var(--c); text-align: left; }
  .mini.on { background: var(--c); color: var(--on); box-shadow: none; }
  .mini b { font: 600 15px "Bricolage Grotesque"; display: flex; gap: 8px; align-items: center; }
  .mini b i { font-size: 13px; }
  .mini small { font-size: 11px; color: var(--muted); }
  .mini.on small { color: inherit; opacity: .7; }
  .foot { margin-top: auto; display: grid; gap: 2px; }
  .link { display: flex; align-items: center; gap: 10px; padding: 8px 6px; color: var(--muted); border-radius: 8px; }
  .link .n { margin-left: auto; font-size: 13px; color: var(--faint); }
  main { padding: 20px 32px 32px; min-width: 0; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
  .seg { display: inline-flex; background: var(--surface); box-shadow: var(--ring); border-radius: 12px; padding: 4px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  .seg button { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 9px; color: var(--muted); white-space: nowrap; }
  .seg button i { font-size: 13px; }
  .seg button.on { background: var(--raised); color: var(--text); }
  .seg button.on i { color: color-mix(in srgb, var(--wallet) var(--gm, 100%), #000); }
  :root.light .seg button.on i { --gm: 70%; }
  .me { display: flex; gap: 14px; align-items: center; color: var(--muted); }
  .sync { font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; color: var(--text); font-size: 13px; }
  .hdr { display: flex; justify-content: space-between; align-items: center; height: 56px; padding: 0 20px; border-bottom: 1px solid var(--line); }
  .hero { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; }
  .card { position: relative; overflow: hidden; background: var(--wallet); color: var(--on-wallet); border-radius: 20px; padding: 20px 22px; min-height: 180px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; }
  .card .emblem { position: absolute; right: -18px; bottom: -22px; width: 140px; transform: rotate(-8deg); }
  .card h1 { font: 700 28px/1.1 "Bricolage Grotesque"; letter-spacing: -.02em; display: flex; gap: 10px; align-items: center; }
  .card h1 i { font-size: 20px; }
  .card .k, .card .meta { font-size: 13px; opacity: .7; }
  .card .big { font: 700 42px/1 "Bricolage Grotesque"; letter-spacing: -.03em; margin-top: 4px; }
  .month { display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; background: color-mix(in srgb, var(--on-wallet) 10%, transparent); border-radius: 10px; padding: 3px; }
  .month button { width: 28px; height: 28px; border-radius: 8px; }
  .month span { padding: 0 6px; font-weight: 600; }
  .tiles { display: grid; gap: 14px; }
  .tile { background: var(--surface); box-shadow: var(--ring); border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; }
  .tile .k { color: var(--muted); font-size: 13px; }
  .tile .v { font: 650 24px/1.1 "Bricolage Grotesque"; letter-spacing: -.02em; }
  .tile .v.in { color: var(--income); }
  .ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); }
  .list { margin-top: 24px; display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 6px; }
  .row .t { font-weight: 550; } .row .c { color: var(--muted); font-size: 13px; } .row .a { font-weight: 600; }
  .tools { display: flex; gap: 10px; margin-top: 24px; }
  .search { flex: 1; display: flex; gap: 10px; align-items: center; background: var(--surface); box-shadow: var(--ring); border-radius: 12px; padding: 9px 14px; color: var(--faint); }
  .ghost { display: inline-flex; gap: 8px; align-items: center; padding: 9px 14px; border-radius: 12px; background: var(--surface); box-shadow: var(--ring); color: var(--muted); }
  .cta { display: inline-flex; gap: 8px; align-items: center; padding: 9px 16px; border-radius: 12px; background: var(--wallet); color: var(--on-wallet); font-weight: 600; white-space: nowrap; }

  /* phones */
  .phones { display: grid; grid-template-columns: repeat(3, 390px); gap: 24px; margin-bottom: 36px; }
  .phone { background: var(--bg); color: var(--text); border-radius: 28px; overflow: hidden; height: 780px; position: relative; display: flex; flex-direction: column; }
  .phone h3 { font: 650 15px "Bricolage Grotesque"; padding: 12px 16px 0; color: var(--muted); }
  .pbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; }
  .switch { display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 12px; background: var(--surface); box-shadow: var(--ring); font-weight: 600; }
  .switch .dot { width: 30px; height: 30px; border-radius: 9px; background: var(--wallet); color: var(--on-wallet); display: grid; place-items: center; font-size: 13px; }
  .pbody { padding: 0 16px; overflow: hidden; flex: 1; }
  .phone .card { min-height: 150px; padding: 16px 18px; }
  .phone .card h1 { font-size: 22px; }
  .phone .card .big { font-size: 34px; }
  .phone .card .emblem { width: 110px; }
  .ptiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .ptiles .tile { grid-template-columns: 1fr; padding: 12px 14px; }
  .ptiles .tile .v { font-size: 19px; }
  .pseg { margin: 14px 0 4px; }
  .pseg .seg { display: flex; }
  .strip { display: flex; gap: 10px; overflow: hidden; padding: 4px 16px 12px; }
  .strip .mini { flex: none; width: 150px; }
  .fab { position: absolute; right: 18px; bottom: 86px; width: 56px; height: 56px; border-radius: 16px; background: var(--wallet); color: var(--on-wallet); display: grid; place-items: center; font-size: 20px; box-shadow: 0 8px 20px -10px rgba(0,0,0,.6); }
  .phone.m3 .fab, .phone.m2 .fab { bottom: 22px; }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); box-shadow: var(--ring); border-top: 1px solid var(--line); padding: 8px 4px 18px; }
  .tabbar button { display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
  .tabbar button i { font-size: 17px; }
  .tabbar button.on { color: var(--text); }
  .tabbar button.on i { color: color-mix(in srgb, var(--wallet) var(--gm, 100%), #000); }
  :root.light .tabbar button.on i { --gm: 70%; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 16px 24px; display: grid; gap: 8px; box-shadow: 0 -20px 40px -20px rgba(0,0,0,.6); }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 6px; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
  .themebtn { position: fixed; right: 16px; bottom: 16px; padding: 8px 14px; border-radius: 12px; background: #efece6; color: #141312; font-weight: 600; z-index: 9; }
</style>
<script>if (location.search.includes("light")) document.documentElement.classList.add("light");</script>
</head>
<body>
  <div id="out"></div>
  <button class="themebtn" onclick="location.search = location.search.includes('light') ? '' : '?light'">Toggle light / dark</button>
<script>
  const onColor = h => { const [r, g, b] = h.match(/\w\w/g).map(x => parseInt(x, 16) / 255); return .2126 * r + .7152 * g + .0722 * b > .5 ? "#1d1a10" : "#ffffff"; };
  const W = [["Empty", "#8b6cf6", "fa-wallet"], ["Demo Wallet", "#f2cc2f", "fa-piggy-bank", 1], ["Holidays", "#2ec4d6", "fa-plane"]];
  const mini = ([n, c, i, on]) => `<button class="mini ${on ? "on" : ""}" style="--c:${c};--on:${onColor(c)}"><b><i class="fa-solid ${i}"></i>${n}</b><small>EUR</small></button>`;
  const TABS = [["fa-receipt", "Transactions"], ["fa-calendar-days", "Subscriptions"], ["fa-chart-pie", "Categories"], ["fa-chart-line", "Statistics"], ["fa-bullseye", "Budget"], ["fa-gear", "Settings"]];
  const seg = () => `<div class="seg">${TABS.map(([i, t], k) => `<button class="${k ? "" : "on"}"><i class="fa-solid ${i}"></i>${t}</button>`).join("")}</div>`;
  const me = () => `<div class="me"><span class="sync"><i class="fa-solid fa-cloud"></i>Synced</span><i class="fa-regular fa-bell"></i><span class="avatar">A</span></div>`;
  const card = () => `<div class="card"><img class="emblem" src="icon.svg" alt=""><div><h1><i class="fa-solid fa-piggy-bank"></i>Demo Wallet</h1><div class="meta">Euro, shared with 1 person</div></div><div><div class="k">Net this month</div><div class="big">−9016,73 €</div><div class="month"><button><i class="fa-solid fa-chevron-left"></i></button><span>October 2026</span><button><i class="fa-solid fa-chevron-right"></i></button></div></div></div>`;
  const tiles = (cls = "tiles") => `<div class="${cls}"><div class="tile"><span class="ic" style="--c:#7fcf95"><i class="fa-solid fa-arrow-trend-up"></i></span><div><div class="k">Income</div><div class="v in">+1750,01 €</div></div></div><div class="tile"><span class="ic" style="--c:#ec8a76"><i class="fa-solid fa-arrow-trend-down"></i></span><div><div class="k">Spent</div><div class="v">10.766,74 €</div></div></div></div>`;
  const rows = () => `<div class="list">${[["fa-utensils", "#ff6b8a", "Food & Entertainment", "Food & Entertainment", "−123,00 €"], ["fa-apple-whole", "#f5a524", "Food", "Groceries", "−888,00 €"], ["fa-money-bill-wave", "#7fcf95", "Monthly Salary", "Work › Salary", "+1750,01 €"], ["fa-car", "#ec6a5e", "Car", "Car", "−5,00 €"]].map(([i, c, t, s, a]) => `<div class="row"><span class="ic" style="--c:${c}"><i class="fa-solid ${i}"></i></span><div><div class="t">${t}</div><div class="c">${s}</div></div><div class="a" ${a[0] === "+" ? 'style="color:var(--income)"' : ""}>${a}</div></div>`).join("")}</div>`;
  const side = (brand) => `<aside>${brand ? `<div class="brand"><img src="icon.svg" alt="">My Wallet</div>` : ""}<div class="side-h">Wallets</div>${W.map(mini).join("")}<div class="foot"><button class="link"><i class="fa-solid fa-envelope"></i>Invitations<span class="n">0</span></button><button class="link"><i class="fa-solid fa-plus"></i>New wallet</button></div></aside>`;
  const tools = () => `<div class="tools"><span class="search"><i class="fa-solid fa-magnifying-glass"></i>Search transactions</span><span class="ghost"><i class="fa-solid fa-filter"></i>Filters</span><span class="cta"><i class="fa-solid fa-plus"></i>New transaction</span></div>`;

  const desktopH1 = `<div class="frame"><div class="app">${side(true)}<main><div class="topbar">${seg()}${me()}</div><div class="hero">${card()}${tiles()}</div>${tools()}${rows()}</main></div></div>`;
  const desktopH2 = `<div class="frame"><div class="hdr"><div class="brand" style="padding:0"><img src="icon.svg" alt="">My Wallet</div>${me()}</div><div class="app">${side(false)}<main><div class="topbar">${seg()}</div><div class="hero">${card()}${tiles()}</div>${tools()}${rows()}</main></div></div>`;

  const pbar = () => `<div class="pbar"><span class="switch"><span class="dot"><i class="fa-solid fa-piggy-bank"></i></span>Demo Wallet <i class="fa-solid fa-chevron-down" style="font-size:11px;color:var(--muted)"></i></span><div class="me"><i class="fa-regular fa-bell"></i><span class="avatar">A</span></div></div>`;
  const m1 = `<div class="phone m1"><h3>M1 · Wallet switcher on top, tabs as scrolling segments</h3>${pbar()}<div class="pbody">${card()}${tiles("ptiles")}<div class="pseg">${seg()}</div>${rows()}</div><span class="fab"><i class="fa-solid fa-plus"></i></span></div>`;
  const m2 = `<div class="phone m2"><h3>M2 · Wallet cards strip (like today), tabs as segments</h3><div class="pbar"><div class="brand" style="padding:0"><img src="icon.svg" alt="">My Wallet</div><div class="me"><i class="fa-regular fa-bell"></i><span class="avatar">A</span></div></div><div class="strip">${W.map(mini).join("")}</div><div class="pbody">${card()}${tiles("ptiles")}<div class="pseg">${seg()}</div>${rows()}</div><span class="fab"><i class="fa-solid fa-plus"></i></span></div>`;
  const m3 = `<div class="phone m3"><h3>M3 · Wallet switcher on top, tabs in a bottom bar</h3>${pbar()}<div class="pbody">${card()}${tiles("ptiles")}${rows()}</div><span class="fab" style="bottom:86px"><i class="fa-solid fa-plus"></i></span>
    <div class="tabbar">${[["fa-receipt", "Transactions", 1], ["fa-calendar-days", "Subscriptions"], ["fa-chart-pie", "Categories"], ["fa-bullseye", "Budget"], ["fa-ellipsis", "More"]].map(([i, t, on]) => `<button class="${on ? "on" : ""}"><i class="fa-solid ${i}"></i>${t}</button>`).join("")}</div></div>`;
  const sheet = `<div class="phone"><h3>Switcher open (M1 / M3)</h3>${pbar()}<div class="pbody">${card()}</div><div class="scrim"></div><div class="sheet"><div class="grab"></div><div class="side-h">Wallets</div>${W.map(mini).join("")}<button class="link"><i class="fa-solid fa-envelope"></i>Invitations<span class="n">0</span></button><button class="link"><i class="fa-solid fa-plus"></i>New wallet</button></div></div>`;

  document.getElementById("out").innerHTML = `
    <div class="h">Desktop · H1 — no header bar</div><p class="lead">Brand at the top of the sidebar; sync, bell and profile on the right of the tabs (as in the approved mockup).</p>${desktopH1}
    <div class="h">Desktop · H2 — slim header bar kept</div><p class="lead">Full-width bar with brand, sync, bell and profile; tabs below it.</p>${desktopH2}
    <div class="h">Phone layouts</div><p class="lead">The sidebar can't fit. Three ways to switch wallet and tab. "+" is a floating button on phones (inline "New transaction" stays on desktop).</p>
    <div class="phones">${m1}${m2}${m3}</div><div class="phones">${sheet}</div>`;
</script>
</body>
</html>
