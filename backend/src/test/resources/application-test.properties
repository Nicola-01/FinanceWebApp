spring.application.name=backend-test

# Use an in-memory database for testing instead of real Postgres
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Settings for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ADMIN USER (Mock values)
application.security.admin.username=admin
application.security.admin.email=admin@example.com
application.security.admin.password=adminpassword

# JWT (Mock values)
application.security.jwt.secret-key=dGhpcy1pcy1hLXZlcnktc2VjdXJlLW1vY2sta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLW9ubHkK
application.security.jwt.expiration=3600000
application.security.jwt.refresh_expiration=86400000

# Frontend / URLs
application.frontend.url=http://localhost:5173
application.backend.url=http://localhost:8080
application.mcpserver.url=http://localhost:8000

# Mail Settings (Mock values to prevent PlaceholderResolutionException)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test-user
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Demo mode
application.demo.enabled=false

# Backup / Restore
backup.db-host=localhost
backup.db-port=5432
backup.db-user=test
backup.db-pass=test
backup.db-name=testdb
backup.dir=/tmp/test-backups
backup.encryption-pass=test-encryption

# Cloudflare R2
r2.access-key=test-access
r2.secret-key=test-secret
r2.endpoint=http://localhost:9000
r2.bucket=test-bucket
r2.enabled=false
