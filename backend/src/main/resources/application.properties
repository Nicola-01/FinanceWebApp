spring.application.name=backend
logging.level.com.zaxxer.hikari=DEBUG

logging.level.web=debug
logging.level.sql=debug
logging.level.org.springframework.security=DEBUG

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ADMIN USER
application.security.admin.username=${ADMIN_USERNAME}
application.security.admin.email=${ADMIN_EMAIL}
application.security.admin.password=${ADMIN_PASSWORD}

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#JWT
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}
application.security.jwt.refresh_expiration=${JWT_REFRESH_EXPIRATION}

# Frontend
application.frontend.url=${FRONTEND_URL:http://localhost:5173}
application.backend.url=${BACKEND_URL:http://localhost:8080}
application.mcpserver.url=${MCP_SERVER_URL:http://localhost:8000}

# OAuth redirect_uri allowlist (hosts). Loopback (localhost/127.0.0.1/::1) is always allowed;
# every other host must be https and listed here. Add the hosts of any hosted MCP clients you use.
application.oauth.allowed-redirect-hosts=${OAUTH_ALLOWED_REDIRECT_HOSTS:claude.ai,claude.com}

# Exchange rates (Frankfurter v2) — used to convert foreign-currency subscriptions
# with the day's rate at execution time.
application.exchange.url=${EXCHANGE_API_URL:https://api.frankfurter.dev/v2}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_PROPERTIES_MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}

# Web Push (VAPID). Empty values disable push sending entirely.
application.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
application.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
application.push.vapid.subject=${VAPID_SUBJECT:mailto:admin@localhost}

# Demo mode
application.demo.enabled=${DEMO_ENABLED:false}

# Backup / Restore
backup.db-host=${DB_HOST:}
backup.db-port=${DB_PORT:}
backup.db-user=${POSTGRES_USER:}
backup.db-pass=${POSTGRES_PASSWORD:}
backup.db-name=${POSTGRES_DB:}
backup.dir=${BACKUP_DIR:}
backup.encryption-pass=${BACKUP_ENCRYPTION_PASS:}

# Cloudflare R2 (S3-compatible)
r2.access-key=${R2_ACCESS_KEY:}
r2.secret-key=${R2_SECRET_KEY:}
r2.endpoint=${R2_ENDPOINT:}
r2.bucket=${R2_BUCKET:}
# Set to false to disable R2 and work only with local files (useful in dev)
r2.enabled=${R2_ENABLED:false}
