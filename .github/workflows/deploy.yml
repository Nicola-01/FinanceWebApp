name: CI/CD Deploy & Maintenance

on:
  push:
    branches: [ "release/*" ]
  schedule:
    # Runs at 03:00 UTC every Sunday
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allows manual triggering

jobs:
  # -------------------------------------------------------------
  # 1. DEPLOY TO TARGET ENVIRONMENTS
  # -------------------------------------------------------------
  deploy:
    name: Deploy to ${{ matrix.environment }}
    # This job only runs on push to release branches
    if: github.event_name == 'push'
    strategy:
      matrix:
        environment: [prod, demo]
    runs-on: [self-hosted, "${{ matrix.environment }}"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup environment variables
        run: |
          cp /home/deployer/.env .
          VERSION=${GITHUB_REF_NAME#release/}
          echo "VITE_APP_VERSION=$VERSION" >> .env
          echo "VITE_APP_BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> .env

      - name: Clean obsolete build artifacts
        run: |
          rm -rf dist assets

      - name: Build and deploy containers
        run: |
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d

      - name: Smart Docker Cleanup
        run: |
          docker image prune -f

  # -------------------------------------------------------------
  # 2. GIT OPERATIONS
  # -------------------------------------------------------------
  git-post-deploy:
    needs: [deploy]
    if: github.event_name == 'push' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push to main directly
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout main
          git merge ${{ github.ref_name }}
          git push origin main

      - name: Cleanup old release branches
        run: |
          git fetch --prune
          branches=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' refs/remotes/origin/release/)
          branch_array=($branches)
          if [ ${#branch_array[@]} -gt 3 ]; then
            for i in "${!branch_array[@]}"; do
              if [ $i -ge 3 ]; then
                branch_to_delete=${branch_array[$i]#origin/}
                git push origin --delete "$branch_to_delete" || true
              fi
            done
          fi

  # -------------------------------------------------------------
  # 3. WEEKLY SYSTEM MAINTENANCE
  # -------------------------------------------------------------
  cron-cleanup:
    name: Weekly Deep Clean
    # This job runs on schedule or manual trigger
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        environment: [prod, demo]
    runs-on: [self-hosted, "${{ matrix.environment }}"]
    steps:
      - name: Deep Prune Docker Resources
        run: |
          docker system prune -a --volumes --filter "until=168h" -f