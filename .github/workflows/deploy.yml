name: CI/CD Deploy to Prod & Demo

on:
  push:
    branches: [ "release/*" ]

jobs:
  # -------------------------------------------------------------
  # 1. DEPLOY TO TARGET ENVIRONMENTS (Prod & Demo instances)
  # -------------------------------------------------------------
  deploy:
    name: Deploy to ${{ matrix.environment }}
    strategy:
      matrix:
        environment: [prod, demo]
    runs-on: [self-hosted, "${{ matrix.environment }}"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup environment variables
        run: |
          # Copy the server-specific .env file from the host machine to the runner's workspace
          cp /home/deployer/.env .
          
          # Inject version and build date derived from the release branch and current timestamp
          VERSION=${GITHUB_REF_NAME#release/}
          echo "VITE_APP_VERSION=$VERSION" >> .env
          echo "VITE_APP_BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> .env

      - name: Clean obsolete build artifacts
        run: |
          # Prevent aggressive Service Worker caching issues by deleting old assets
          rm -rf dist
          rm -rf assets

      - name: Build and deploy containers
        run: |
          # Force a clean build from scratch without using Docker cache
          docker compose -f docker-compose.prod.yml build --no-cache
          # Start the containers, forcing recreation
          docker compose -f docker-compose.prod.yml up -d --force-recreate

      - name: Prune unused Docker resources
        run: docker builder prune -f && docker image prune -f

  # -------------------------------------------------------------
  # 2. GIT OPERATIONS (Executed by GitHub Cloud, only once)
  # -------------------------------------------------------------
  git-post-deploy:
    needs: [deploy] # Wait for both Prod and Demo deployments to finish
    if: success() # Execute only if both deployments are successful
    runs-on: ubuntu-latest # Use GitHub runners to avoid occupying the Mini PCs
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push to main directly
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout main
          git merge ${{ github.ref_name }}
          git push origin main

      - name: Cleanup old release branches
        if: success()
        run: |
          # Fetch all branches strictly to ensure we have the latest remotes
          git fetch --prune
          # List all remote release branches, sorted by committer date (newest first)
          branches=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' refs/remotes/origin/release/)
          
          # Convert to array
          branch_array=()
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              branch_array+=("$line")
            fi
          done <<< "$branches"
          
          # If more than 3, delete the older ones
          if [ ${#branch_array[@]} -gt 3 ]; then
            for i in "${!branch_array[@]}"; do
              if [ $i -ge 3 ]; then
                # Strip origin/ from branch name
                branch_to_delete=${branch_array[$i]#origin/}
                echo "Deleting old release branch: $branch_to_delete"
                git push origin --delete "$branch_to_delete" || true
              fi
            done
          fi