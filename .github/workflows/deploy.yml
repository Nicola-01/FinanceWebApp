name: CI/CD Pipeline

on:
  push:
    branches: 
      - demo
      - main
      - release/*
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. PATH FILTERING
  # -------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # -------------------------------------------------------------
  # 2. BACKEND CI (Lint, Test, Build, Push)
  # -------------------------------------------------------------
  build-backend:
    needs: changes
    # Non builda su main: main applica solo le immagini gia costruite da release/*.
    if: >
      github.ref != 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        working-directory: ./backend
        run: chmod +x ./gradlew
        
      - name: Lint (Spotless) and Test (JaCoCo Coverage)
        working-directory: ./backend
        run: ./gradlew check
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/app-backend
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=demo,enable=${{ github.ref == 'refs/heads/demo' }}
            type=raw,value=prod,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=match,pattern=release/(.*),group=1
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # -------------------------------------------------------------
  # 3. FRONTEND CI (Lint, Build, Push)
  # -------------------------------------------------------------
  build-frontend:
    needs: changes
    # Non builda su main: main applica solo le immagini gia costruite da release/*.
    if: >
      github.ref != 'refs/heads/main' &&
      (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
          
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Lint (ESLint + Prettier)
        working-directory: ./frontend
        run: npm run lint
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/app-frontend
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=demo,enable=${{ github.ref == 'refs/heads/demo' }}
            type=raw,value=prod,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=match,pattern=release/(.*),group=1
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: production
          push: true
          # NOTA: a build-time Vite cuoce solo VITE_DEMO_ENABLED / VITE_ALLOWED_HOSTS.
          # API URL, versione e data NON stanno qui: sono iniettate a RUNTIME nel
          # container via /config.js (window.__ENV__). Una sola immagine serve tutti
          # gli ambienti; i valori arrivano dal .env del rispettivo LXC allo start.
          build-args: |
            VITE_DEMO_ENABLED=${{ github.ref == 'refs/heads/demo' && 'true' || 'false' }}
            VITE_ALLOWED_HOSTS=${{ vars.VITE_ALLOWED_HOSTS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # -------------------------------------------------------------
  # 4. TAG RELEASE (vX.Y.Z dal nome del branch)
  # -------------------------------------------------------------
  # Su un push a release/vX.Y.Z (CI verde), crea e pusha il git tag vX.Y.Z
  # sul commit di release. Questo tag e la SORGENTE UNICA della versione:
  # sia demo (merge da release) sia prod (promote in main) avranno quel
  # commit come antenato, quindi lo step di deploy lo legge con `git describe`
  # e lo inietta a runtime nel container (version.json). Idempotente: se il
  # tag esiste gia non fa nulla. Basta il GITHUB_TOKEN (un tag push non deve
  # ritriggerare workflow).
  tag-release:
    needs: [build-backend, build-frontend]
    if: |
      always() &&
      startsWith(github.ref, 'refs/heads/release/') &&
      needs.build-backend.result != 'failure' &&
      needs.build-backend.result != 'cancelled' &&
      needs.build-frontend.result != 'failure' &&
      needs.build-frontend.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create and push tag vX.Y.Z
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"   # release/v2.7.1 -> v2.7.1
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION gia esistente, skip."
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "refs/tags/$VERSION"
          fi

  # -------------------------------------------------------------
  # 5. AUTO-PROMOTE release/* -> main (dopo CI verde)
  # -------------------------------------------------------------
  # Se la CI su un branch release/* passa, il codice viene mergiato
  # automaticamente in main. Il push usa un PAT (secrets.PAT_PROMOTE),
  # NON il GITHUB_TOKEN di default: quest'ultimo, per protezione
  # anti-loop di GitHub, non farebbe ripartire nessun workflow — e
  # quindi il deploy su prod non scatterebbe mai. Col PAT il push su
  # main ritrigghera l'intera pipeline (build immagine 'prod' + deploy).
  promote-to-main:
    # Dipende da tag-release: il tag vX.Y.Z deve essere pushato PRIMA di
    # promuovere in main, altrimenti il deploy su main partirebbe e `git describe`
    # non troverebbe ancora il tag (versione mostrata errata).
    needs: [build-backend, build-frontend, tag-release]
    if: |
      always() &&
      startsWith(github.ref, 'refs/heads/release/') &&
      needs.build-backend.result != 'failure' &&
      needs.build-backend.result != 'cancelled' &&
      needs.build-frontend.result != 'failure' &&
      needs.build-frontend.result != 'cancelled' &&
      needs.tag-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (con PAT per ritriggerare Actions su main)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PROMOTE }}

      - name: Merge release/* -> main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --no-ff "$GITHUB_SHA" -m "Auto-promote ${GITHUB_REF_NAME} -> main"
          git push origin main

  # -------------------------------------------------------------
  # 6. DEPLOY (Self-hosted on minipc)
  # -------------------------------------------------------------
  deploy:
    needs: [changes, build-backend, build-frontend]
    if: |
      always() &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (github.ref == 'refs/heads/demo' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, "${{ github.ref == 'refs/heads/demo' && 'demo' || 'prod' }}"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0        # serve la storia + i tag per `git describe`
          fetch-tags: true

      - name: Setup environment variables
        run: |
          cp /home/deployer/.env .
          # GHCR/Docker richiedono il nome repository tutto minuscolo (owner incluso).
          echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> .env
          echo "APP_TAG=${{ github.ref == 'refs/heads/demo' && 'demo' || 'prod' }}" >> .env
          # Versione (dal tag piu recente raggiungibile) e data del deploy (senza orario),
          # iniettate a runtime nel container frontend via config.js (window.__ENV__).
          # L'API URL arriva invece da VITE_API_URL, gia presente nel .env del server.
          APP_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo dev)"
          echo "APP_VERSION=${APP_VERSION}" >> .env
          echo "APP_BUILD_DATE=$(date -u +'%Y-%m-%d')" >> .env

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull Docker images
        run: docker compose -f docker-compose.prod.yml pull

      - name: Start Docker containers
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Smart Docker Cleanup
        run: docker image prune -f

  # -------------------------------------------------------------
  # 7. WEEKLY SYSTEM MAINTENANCE
  # -------------------------------------------------------------
  cron-cleanup:
    name: Weekly Deep Clean
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        environment: [prod, demo]
    runs-on: [self-hosted, "${{ matrix.environment }}"]
    steps:
      - name: Deep Prune Docker Resources
        run: docker system prune -a --volumes --filter "until=168h" -f