name: CI/CD Deploy to Prod & Demo

on:
  push:
    branches: [ "release/*" ]

jobs:
  # -------------------------------------------------------------
  # 1. DEPLOY TO PRODUCTION (Mini PC 1)
  # -------------------------------------------------------------
  deploy-prod:
    runs-on: [self-hosted, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Copy .env from Host to Runner workspace and inject Version
        run: |
          cp /home/deployer/.env .
          VERSION=${GITHUB_REF_NAME#release/}
          echo "VITE_APP_VERSION=$VERSION" >> .env
          echo "VITE_APP_BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> .env

      - name: Clean old build files (dist & assets)
        run: |
          rm -rf dist
          rm -rf assets

      - name: Deploy with Production Compose
        run: |
          docker compose -f docker-compose.prod.yml build --no-cache
          docker compose -f docker-compose.prod.yml up -d --force-recreate

      - name: Cleanup unused Docker resources
        run: docker builder prune -f && docker image prune -f

  # -------------------------------------------------------------
  # 2. DEPLOY TO DEMO (Mini PC 2 - Executed in parallel)
  # -------------------------------------------------------------
  deploy-demo:
    runs-on: [self-hosted, demo]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Copy .env from Host to Runner workspace and inject Version
        run: |
          # Use the local .env of the Demo CT (which might have a different database)
          cp /home/deployer/.env .
          VERSION=${GITHUB_REF_NAME#release/}
          echo "VITE_APP_VERSION=$VERSION" >> .env
          echo "VITE_APP_BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> .env

      - name: Clean old build files (dist & assets)
        run: |
          echo "Preventive cleanup of dist and assets folders to avoid 404 errors on the Service Worker..."
          rm -rf dist
          rm -rf assets
          # Note: If you use different paths for the Nginx bind mount (e.g., ./nginx/html), add the rm -rf command for those as well.

      - name: Deploy with Production Compose
        run: |
          # 1. Force a clean build from scratch without using Docker cache
          docker compose -f docker-compose.demo.yml build --no-cache
          # 2. Start the containers, forcing them to be recreated
          docker compose -f docker-compose.demo.yml up -d --force-recreate

      - name: Cleanup unused Docker resources
        run: docker builder prune -f && docker image prune -f

  # -------------------------------------------------------------
  # 3. GIT OPERATIONS (Executed by GitHub Cloud, only once)
  # -------------------------------------------------------------
  git-post-deploy:
    needs: [deploy-prod, deploy-demo] # Wait for Prod and Demo to finish
    if: success() # Execute only if both deployments are successful
    runs-on: ubuntu-latest # Use GitHub runners to avoid occupying your Mini PCs
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push to main directly
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout main
          git merge ${{ github.ref_name }}
          git push origin main

      - name: Cleanup old release branches
        if: success()
        run: |
          # Fetch all branches strictly to ensure we have the latest remotes
          git fetch --prune
          # List all remote release branches, sorted by committer date (newest first)
          branches=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' refs/remotes/origin/release/)
          
          # Convert to array
          branch_array=()
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              branch_array+=("$line")
            fi
          done <<< "$branches"
          
          # If more than 3, delete the older ones
          if [ ${#branch_array[@]} -gt 3 ]; then
            for i in "${!branch_array[@]}"; do
              if [ $i -ge 3 ]; then
                # Strip origin/ from branch name
                branch_to_delete=${branch_array[$i]#origin/}
                echo "Deleting old release branch: $branch_to_delete"
                git push origin --delete "$branch_to_delete" || true
              fi
            done
          fi