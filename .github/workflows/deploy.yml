name: CI/CD Pipeline

on:
  push:
    branches: 
      - demo
      - main
      - release/*
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. PATH FILTERING
  # -------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # -------------------------------------------------------------
  # 2. BACKEND CI (Lint, Test, Build, Push)
  # -------------------------------------------------------------
  build-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        working-directory: ./backend
        run: chmod +x ./gradlew
        
      - name: Lint (Spotless) and Test (JaCoCo Coverage)
        working-directory: ./backend
        run: ./gradlew check
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/app-backend
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=demo,enable=${{ github.ref == 'refs/heads/demo' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=release/(.*),group=1
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # -------------------------------------------------------------
  # 3. FRONTEND CI (Lint, Build, Push)
  # -------------------------------------------------------------
  build-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
          
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Lint (ESLint + Prettier)
        working-directory: ./frontend
        run: npm run lint
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/app-frontend
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=demo,enable=${{ github.ref == 'refs/heads/demo' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=release/(.*),group=1
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          # NOTA: Per il frontend, Vite "cuoce" le variabili d'ambiente a tempo di compilazione.
          # Imposta queste variabili nei GitHub Actions Variables del repo!
          build-args: |
            VITE_APP_VERSION=${{ github.sha }}
            VITE_APP_BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VITE_DEMO_ENABLED=${{ github.ref == 'refs/heads/demo' && 'true' || 'false' }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_ALLOWED_HOSTS=${{ vars.VITE_ALLOWED_HOSTS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # -------------------------------------------------------------
  # 4. AUTO-PROMOTE release/* -> main (dopo CI verde)
  # -------------------------------------------------------------
  # Se la CI su un branch release/* passa, il codice viene mergiato
  # automaticamente in main. Il push usa un PAT (secrets.PAT_PROMOTE),
  # NON il GITHUB_TOKEN di default: quest'ultimo, per protezione
  # anti-loop di GitHub, non farebbe ripartire nessun workflow — e
  # quindi il deploy su prod non scatterebbe mai. Col PAT il push su
  # main ritrigghera l'intera pipeline (build immagine 'prod' + deploy).
  promote-to-main:
    needs: [build-backend, build-frontend]
    if: |
      always() &&
      startsWith(github.ref, 'refs/heads/release/') &&
      needs.build-backend.result != 'failure' &&
      needs.build-backend.result != 'cancelled' &&
      needs.build-frontend.result != 'failure' &&
      needs.build-frontend.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (con PAT per ritriggerare Actions su main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PROMOTE }}

      - name: Merge release/* -> main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --no-ff "$GITHUB_SHA" -m "Auto-promote ${GITHUB_REF_NAME} -> main"
          git push origin main

  # -------------------------------------------------------------
  # 5. DEPLOY (Self-hosted on minipc)
  # -------------------------------------------------------------
  deploy:
    needs: [changes, build-backend, build-frontend]
    if: |
      always() && 
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (github.ref == 'refs/heads/demo' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, "${{ github.ref == 'refs/heads/demo' && 'demo' || 'prod' }}"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup environment variables
        run: |
          cp /home/deployer/.env .
          echo "GHCR_OWNER=${{ github.repository_owner }}" >> .env
          echo "APP_TAG=${{ github.ref == 'refs/heads/demo' && 'demo' || 'prod' }}" >> .env

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull Docker images
        run: docker compose -f docker-compose.prod.yml pull

      - name: Start Docker containers
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Smart Docker Cleanup
        run: docker image prune -f

  # -------------------------------------------------------------
  # 6. WEEKLY SYSTEM MAINTENANCE
  # -------------------------------------------------------------
  cron-cleanup:
    name: Weekly Deep Clean
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        environment: [prod, demo]
    runs-on: [self-hosted, "${{ matrix.environment }}"]
    steps:
      - name: Deep Prune Docker Resources
        run: docker system prune -a --volumes --filter "until=168h" -f