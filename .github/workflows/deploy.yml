name: CI/CD Deploy to Mini PC

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Copy .env from Host to Runner workspace
        run: |
          cp /home/deployer/.env .

      - name: Prune Docker images
        run: docker system prune -af

      - name: Deploy with Production Compose
        run: |
          docker compose -f docker-compose.prod.yml up -d --build