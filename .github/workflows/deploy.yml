name: CI/CD Deploy to Mini PC

on:
  push:
    branches: [ "release/*" ]

jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Copy .env from Host to Runner workspace and inject Version
        run: |
          cp /home/deployer/.env .
          # Extract version from branch name, e.g., release/v1.1.2 -> v1.1.2
          VERSION=${GITHUB_REF_NAME#release/}
          echo "VITE_APP_VERSION=$VERSION" >> .env
          echo "VITE_APP_BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> .env

      - name: Deploy with Production Compose
        run: |
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Cleanup unused Docker resources
        run: docker builder prune -f && docker image prune -f

      - name: Create PR to main
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if an open PR already exists for this branch targeting main
          PR_EXISTS=$(gh pr list --head ${{ github.ref_name }} --base main --json number --jq 'length')
          
          if [ "$PR_EXISTS" -eq "0" ]; then
            gh pr create \
              --base main \
              --head ${{ github.ref_name }} \
              --title "Release ${{ github.ref_name }}" \
              --body "🚀 Build & Deploy completed successfully for **${{ github.ref_name }}**!
              
              Click the **Merge pull request** button below to merge the code into \`main\` and keep it up to date."
            echo "Pull Request created successfully!"
          else
            echo "An open Pull Request already exists for this branch."
          fi

      - name: Cleanup old release branches
        if: success()
        run: |
          # Fetch all branches strictly to ensure we have the latest remotes
          git fetch --prune
          # List all remote release branches, sorted by committer date (newest first)
          branches=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' refs/remotes/origin/release/)
          
          # Convert to array
          branch_array=()
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              branch_array+=("$line")
            fi
          done <<< "$branches"
          
          # If more than 3, delete the older ones
          if [ ${#branch_array[@]} -gt 3 ]; then
            for i in "${!branch_array[@]}"; do
              if [ $i -ge 3 ]; then
                # Strip origin/ from branch name
                branch_to_delete=${branch_array[$i]#origin/}
                echo "Deleting old release branch: $branch_to_delete"
                git push origin --delete "$branch_to_delete" || true
              fi
            done
          fi