server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service Worker + runtime config should never be cached (config.js e
    # generato all'avvio del container, deve essere sempre rivalidato).
    location ~* (sw\.js|registerSW\.js|config\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Cache other static assets aggressively
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg)$ {
        expires max;
        add_header Pragma public;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }
}