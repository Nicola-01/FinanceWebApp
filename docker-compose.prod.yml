services:
  # 1. Database Service
  db:
    image: postgres:16-alpine
    container_name: finance_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # CONSIGLIO: Usa un volume nominale invece di una cartella locale
      # per evitare che il runner cancelli i dati per sbaglio durante le pulizie
      - finance_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Service
  backend:
    build:
      context: ./backend
      target: production
    container_name: finance_backend_prod
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${DATABASE_ROOT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_LONG_EXPIRATION: ${JWT_LONG_EXPIRATION}
      JWT_SHORT_EXPIRATION: ${JWT_SHORT_EXPIRATION}

      ADMIN_EMAIL: ${ADMIN_EMAIL}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${MAIL_PROPERTIES_MAIL_SMTP_AUTH}
      MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}

      DEMO_ENABLED: ${DEMO_ENABLED}

      BACKUP_CONTAINER_NAME: ${BACKUP_CONTAINER_NAME}
      BACKUP_DB_NAME: ${BACKUP_DB_NAME}
      BACKUP_DIR: ${BACKUP_DIR}
      BACKUP_ENCRYPTION_PASS: ${BACKUP_ENCRYPTION_PASS}

      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENABLED: ${R2_ENABLED}

  # 3. Frontend Service (PULITO)
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: ${BACKEND_URL}
        VITE_ALLOWED_HOSTS: ${FRONTEND_URL}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-'dev'}
        VITE_APP_BUILD_DATE: ${VITE_APP_BUILD_DATE:-''}
        VITE_DEMO_ENABLED: ${DEMO_ENABLED}
    container_name: finance_frontend_prod
    restart: always
    ports:
      - "3000:80"
    # Niente volumes (il codice è dentro l'immagine)
    # Niente environment (le variabili sono già "cotte" nel JS)

volumes:
  finance_db_data: # Definisce il volume persistente per il DB