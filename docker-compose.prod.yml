  # 1. Database Service
  #  db:
  #    image: postgres:16-alpine
  #    container_name: finance_db_prod
  #    restart: always
  #    environment:
  #      POSTGRES_DB: ${POSTGRES_DB}
  #      POSTGRES_USER: ${POSTGRES_USER}
  #      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #    ports:
  #      - "5432:5432"
  #    volumes:
  #      # CONSIGLIO: Usa un volume nominale invece di una cartella locale
  #      # per evitare che il runner cancelli i dati per sbaglio durante le pulizie
  #      - finance_db_data:/var/lib/postgresql/data
  #    healthcheck:
  #      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
  #      interval: 5s
  #      timeout: 5s
  #      retries: 5

  # 2. Backend Service
  backend:
    image: ghcr.io/${GHCR_OWNER}/app-backend:${APP_TAG:-prod}
    container_name: finance_backend_prod
    restart: always
    ports:
      - "8080:8080"
    #    depends_on:
    #      db:
    #        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      MCP_SERVER_URL: ${MCP_SERVER_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_LONG_EXPIRATION: ${JWT_LONG_EXPIRATION}
      JWT_SHORT_EXPIRATION: ${JWT_SHORT_EXPIRATION}

      ADMIN_EMAIL: ${ADMIN_EMAIL}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${MAIL_PROPERTIES_MAIL_SMTP_AUTH}
      MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}

      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}

      DEMO_ENABLED: ${DEMO_ENABLED:-false}

      BACKUP_DIR: ${BACKUP_DIR}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      BACKUP_ENCRYPTION_PASS: ${BACKUP_ENCRYPTION_PASS}

      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENABLED: ${R2_ENABLED:-false}

  # 3. Frontend Service (PULITO)
  frontend:
    image: ghcr.io/${GHCR_OWNER}/app-frontend:${APP_TAG:-prod}
    container_name: finance_frontend_prod
    restart: always
    ports:
      - "3000:80"
    # Niente volumes (il codice è dentro l'immagine)
    # API URL, versione e data sono a RUNTIME: passate come env, l'entrypoint
    # dell'immagine scrive /config.js (window.__ENV__) all'avvio. Una SOLA
    # immagine serve demo e prod: cambia solo il .env del rispettivo LXC, senza
    # ricostruire il frontend. APP_API_URL usa BACKEND_URL (URL pubblico del
    # backend) del .env; axios ci aggiunge "/api".
    environment:
      APP_API_URL: ${BACKEND_URL:-}
      APP_VERSION: ${APP_VERSION:-dev}
      APP_BUILD_DATE: ${APP_BUILD_DATE:-}

  # 4. MCP Server
  mcp:
    build:
      context: ./mcp-server
    container_name: finance_mcp_prod
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - backend
    environment:
      BACKEND_URL: ${BACKEND_URL}
      MCP_SERVER_URL: ${MCP_SERVER_URL}
      AUTH_SERVER_URL: ${BACKEND_URL}

volumes:
  finance_db_data: # Definisce il volume persistente per il DB
